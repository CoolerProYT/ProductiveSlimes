plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.165'
    id "net.neoforged.gradle.mixin" version "7.0.142"
}

mixin {
    config "${mod_id}.mixins.json"
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { // TOP
        url "https://maven.k-4u.nl"
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven { url 'https://modmaven.dev/' }
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url "https://maven.architectury.dev/" }
}

base {
    archivesName = mod_id
}

accessTransformers {
    file('src/main/resources/META-INF/accesstransformer.cfg')
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        programArgument '--nogui'
    }

    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    clientData {
        jvmArguments '-Dneoforge.datagen=true'
        programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    compileOnly 'me.shedaniel.cloth:basic-math:0.6.1'
    compileOnly "dev.architectury:architectury-neoforge:15.0.3"
    compileOnly 'me.shedaniel:RoughlyEnoughItems-neoforge:18.0.798'
    compileOnly "me.shedaniel:REIPluginCompatibilities-forge-annotations:12.+"

    runtimeOnly  "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"

//    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
//    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"

//    implementation "mcjty.theoneprobe:theoneprobe:${top_version}"

    implementation "curse.maven:lake-feature-fix-1203911:6213821"
    implementation "curse.maven:jade-324717:${jade_id}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

subsystems {
    parchment {
        minecraftVersion = "1.21.4"
        mappingsVersion = "2024.12.07"
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
